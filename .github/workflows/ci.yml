name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    name: Repository contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v4.3.0
      - name: Check out the source tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate repository contracts
        run: sh tools/ci/repository-contracts.sh

  freebsd-build-test:
    name: FreeBSD 15.1 build and test
    needs: repository-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # actions/checkout v4.3.0
      - name: Check out the source tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # vmactions/freebsd-vm v1.5.4. The action boots a disposable FreeBSD
      # guest; it is not a persistent or privileged Northstar builder.
      - name: Build and test on FreeBSD 15.1
        uses: vmactions/freebsd-vm@d0518f912576ae759075aa00fb9fe27037940271
        with:
          release: "15.1"
          arch: x86_64
          cpu: 2
          mem: 8192
          copyback: false
          prepare: |
            pkg install -y \
              cmake \
              git \
              ninja \
              pkgconf \
              plasma6-layer-shell-qt \
              qt6-base \
              qt6-declarative \
              qt6-wayland
            pw useradd northstarci -m -s /bin/sh
          run: |
            set -eu
            workspace=$(pwd)
            chown -R northstarci:northstarci "$workspace"
            freebsd-version -ku
            su -m northstarci -c "export HOME=/home/northstarci; cd '$workspace' && sh tools/ci/repository-contracts.sh"
            su -m northstarci -c "export HOME=/home/northstarci; cd '$workspace' && make test BUILD_DIR=build-ci"
