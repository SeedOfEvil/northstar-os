<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Northstar Welcome</title>
  <desc id="desc">A blue Northstar compass on a deep navy field.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182b4b"/>
      <stop offset="1" stop-color="#0b101a"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8bd0ff"/>
      <stop offset="0.5" stop-color="#4d9cf5"/>
      <stop offset="1" stop-color="#1d5ca8"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#field)"/>
  <circle cx="64" cy="64" r="45" fill="none" stroke="#79b8ff" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M64 17 73 55 111 64 73 73 64 111 55 73 17 64 55 55Z" fill="url(#star)" stroke="#d8f1ff" stroke-width="2"/>
  <circle cx="64" cy="64" r="7" fill="#f5fbff"/>
