# Northstar signed repository policy template.
#
# This is a packaging input, not an active repository configuration. A release
# builder must replace every UNSET value with the selected channel's exact
# HTTPS endpoint and SHA-256 signing-key fingerprint before installation.

channel=development
repository_name=Northstar Development
repository_url=UNSET
signing_key_fingerprint=UNSET
trust_mode=required
