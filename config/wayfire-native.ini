[core]
# Keep the stock plugin set used by the FreeBSD Wayfire package and add the
# IPC layers Northstar uses for the task dock. Native DRM outputs are left to
# wlroots so the compositor uses the connected panel's preferred mode instead
# of inheriting the fixed Proxmox X11 compatibility size.
plugins = \
  ipc \
  ipc-rules \
  xdg-activation \
  alpha \
  animate \
  autostart \
  command \
  cube \
  decoration \
  expo \
  fast-switcher \
  fisheye \
  foreign-toplevel \
  grid \
  gtk-shell \
  idle \
  invert \
  move \
  oswitch \
  place \
  resize \
  session-lock \
  shortcuts-inhibit \
  switcher \
  vswitch \
  wayfire-shell \
  window-rules \
  wm-actions \
  wobbly \
  wrot \
  zoom

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = qterminal

# Keep the global shortcut at compositor scope so it works even when no
# ordinary Northstar window holds keyboard focus.
binding_search = <ctrl> KEY_K
command_search = northstar-shell-command toggle-search
