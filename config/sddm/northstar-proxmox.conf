# Keep the greeter on its proven X11 path. User sessions are published into
# boot-generated directories by northstar-session-selector: native DRM gets
# the Wayland entry, while Proxmox/basic-VGA gets the X11/pixman fallback.

[General]
DisplayServer=x11

[Theme]
Current=northstar

[X11]
SessionDir=/var/run/northstar/xsessions

[Wayland]
SessionDir=/var/run/northstar/wayland-sessions
