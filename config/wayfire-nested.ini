[core]
# Keep the stock plugin set used by the FreeBSD Wayfire package and add the
# IPC layers Northstar uses for the task dock.  ipc-rules provides the
# window-rules/list-views and focus-view methods; wm-actions provides
# wm-actions/set-minimized.
plugins = \
  ipc \
  ipc-rules \
  alpha \
  animate \
  autostart \
  command \
  cube \
  decoration \
  expo \
  fast-switcher \
  fisheye \
  foreign-toplevel \
  grid \
  gtk-shell \
  idle \
  invert \
  move \
  oswitch \
  place \
  resize \
  session-lock \
  shortcuts-inhibit \
  switcher \
  vswitch \
  wayfire-shell \
  window-rules \
  wm-actions \
  wobbly \
  wrot \
  zoom

[output:X11-1]
# The nested X11 backend defaults to 1024x768. The Proxmox scfb display used
# by this supplemental lane is 1280x800, so request the full available output.
mode = 1280x800

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = qterminal
